version: 1.0.{build}
image: Visual Studio 2019
configuration:
- Release
platform:
- x64
- Win32
before_build:
- ps: |
    if ($env:APPVEYOR_PULL_REQUEST_NUMBER) {
      git fetch --no-tags origin "refs/heads/$env:APPVEYOR_REPO_BRANCH"
      if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the pull request base.' }
      $base = 'FETCH_HEAD'
    }
    git submodule update --init --recursive
    if ($LASTEXITCODE -ne 0) { throw 'Could not initialize submodules.' }
    .\Deploy\Check-Contribution.ps1 -Base $base
- cmd: >-
    mkdir Debug\plugins\ConEmu\Background

    mkdir Debug\plugins\ConEmu\Lines

    mkdir Debug\plugins\ConEmu\Thumbs
build:
  project: src\CE.sln
  parallel: true
  verbosity: minimal
test_script:
- cmd: >-
    call "%Configuration%\Tests_%Configuration%_%Platform%.exe"
deploy: off
